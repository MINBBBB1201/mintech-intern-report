name: Verify Mintech internship portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run constructed record tests
        run: python code/verify_records.py --out .validation/software_validation
      - name: Check empty field template
        run: python code/record_validation.py templates/field_records.csv --out .validation/empty_input.json
      - name: Inspect export structure and evidence
        run: python code/audit_export.py
      - name: Install report dependencies
        run: python -m pip install -r code/requirements-report.txt
      - name: Rebuild privacy-filtered reports
        run: python code/build_reports.py
